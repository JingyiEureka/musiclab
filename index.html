<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MusicLab &mdash; music editing made easy</title>
    <meta name="description"
        content="MusicLab lets you adjust the playback speed of audio sections independently and export the result as an MP3." />
    <link rel="stylesheet" href="/static/styles.css" />
</head>

<body>
    <div class="container">

        <!-- Header -->
        <header>
            <pre>
█▀▄▀█ █ █ █▀▀ █ █▀▀   █   █▀█ █▀▄
█ ▀ █ █ █ ▀▀█ █ █     █   █▀█ █▀▄
█   █ █▄█ ▄▄█ █ █▄▄   █▄▄ █ █ █▄▀
            </pre>
            <div class="tagline">music editing made easy</div>
            <div class="prompt cursor"><span id="tip-text"></span></div>
        </header>

        <!-- Upload / Player -->
        <div class="divider"></div>
        <div class="section">
            <div class="section-title">Audio <span class="player-label" id="player-filename"></span></div>
            <div class="upload-zone" id="upload-zone">
                <input type="file" id="audio-file-input"
                    accept="audio/*,video/*,.mp3,.wav,.flac,.ogg,.oga,.opus,.m4a,.aac,.aiff,.aif,.mp4,.mov,.webm" />
                <span class="hint">Drop or select audio / video</span>
            </div>
            <div id="upload-error" class="upload-error"></div>
            <div id="player-section">
                <div class="player-row">
                    <div class="waveform-wrap" id="waveform-wrap">
                        <span class="waveform-time" id="player-total">0:00</span>
                        <span class="playhead-time" id="player-current">0:00</span>
                        <div id="waveform-inner">
                            <div class="playhead-line" id="playhead"></div>
                            <canvas id="waveform-canvas"></canvas>
                        </div>
                    </div>
                    <div class="player-bar-row">
                        <button class="player-btn" id="play-btn">[ Play ]</button>
                    </div>
                    <div class="player-bar-row">
                        <button class="player-btn" id="btn-add-segment" title="Split at current position (Enter)">[ Split ]</button>
                    </div>
                </div>
                <div class="tip keyboard-tip"># tip: use `space` key to play/pause<br /># use `enter` to split the music</div>
            </div>
        </div>

        <!-- Segments -->
        <div id="sections-block">
            <div class="divider"></div>
            <div class="section">
                <div class="section-title">Sections</div>
                <div id="segments-container"></div>
                <div id="seg-notification" class="seg-notification"></div>
            </div>
        </div>

        <!-- Output -->
        <div id="output-block">
            <div class="divider"></div>
            <div class="section">
                <div class="section-title">Output</div>

                <div class="output-row">
                    <span class="output-label">Estimated duration:</span>
                    <span id="predicted-duration-text">--:--</span>
                </div>

                <button class="btn btn-export" id="export-btn">[ Export ]</button>

                <div id="status-banner"><span id="status-text"></span></div>
            </div>
        </div>

    </div>

    <script src="/static/app.js"></script>
</body>

</html>
