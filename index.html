<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gamzatti · 声乐练习变速工具</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,600&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0a12;
            --surface: #12121e;
            --surface2: #1a1a2e;
            --border: rgba(255, 255, 255, 0.08);
            --accent: #a78bfa;
            --accent2: #60a5fa;
            --accent3: #f472b6;
            --text: #e2e8f0;
            --muted: #64748b;
            --danger: #f87171;
            --success: #34d399;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── Animated BG ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 10%, rgba(167, 139, 250, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 90%, rgba(96, 165, 250, 0.1) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 50% 50%, rgba(244, 114, 182, 0.05) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        /* ── Header ── */
        header {
            text-align: center;
            margin-bottom: 48px;
        }

        .logo-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(167, 139, 250, 0.12);
            border: 1px solid rgba(167, 139, 250, 0.3);
            border-radius: 999px;
            padding: 6px 16px;
            font-size: 13px;
            color: var(--accent);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .logo-badge svg {
            width: 14px;
            height: 14px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.2rem, 5vw, 3.6rem);
            background: linear-gradient(135deg, #c4b5fd 0%, #60a5fa 50%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
            margin-bottom: 12px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        /* ── Card ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 20px;
            backdrop-filter: blur(12px);
            transition: border-color 0.3s;
        }

        .card:hover {
            border-color: rgba(167, 139, 250, 0.25);
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ── File Upload ── */
        .upload-zone {
            border: 2px dashed rgba(167, 139, 250, 0.3);
            border-radius: 16px;
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .upload-zone::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(167, 139, 250, 0.05) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .upload-zone:hover,
        .upload-zone.drag-over {
            border-color: var(--accent);
            background: rgba(167, 139, 250, 0.05);
        }

        .upload-zone:hover::before,
        .upload-zone.drag-over::before {
            opacity: 1;
        }

        .upload-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            background: rgba(167, 139, 250, 0.15);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .upload-icon svg {
            width: 28px;
            height: 28px;
            color: var(--accent);
        }

        .upload-zone h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .upload-zone p {
            color: var(--muted);
            font-size: 13px;
        }

        .upload-zone input[type="file"] {
            display: none;
        }

        #file-name-display {
            display: none;
            margin-top: 12px;
            padding: 8px 16px;
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.3);
            border-radius: 8px;
            color: var(--success);
            font-size: 13px;
            font-weight: 500;
        }

        /* ── Waveform / Audio Player ── */
        #audio-player-section {
            display: none;
            margin-top: 20px;
        }

        .waveform-container {
            background: var(--surface2);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }

        /* Cut mode active state */
        .waveform-container.cut-mode {
            border: 2px solid rgba(251, 191, 36, 0.5);
            cursor: crosshair;
        }

        .waveform-container.cut-mode #waveform-canvas {
            cursor: crosshair;
        }

        /* Cut marker lines on waveform */
        .cut-marker {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .cut-marker-line {
            width: 2px;
            flex: 1;
            background: rgba(251, 191, 36, 0.85);
            box-shadow: 0 0 6px rgba(251, 191, 36, 0.6);
        }

        .cut-marker-label {
            position: absolute;
            top: 4px;
            background: rgba(251, 191, 36, 0.9);
            color: #000;
            font-size: 9px;
            font-weight: 700;
            padding: 1px 4px;
            border-radius: 3px;
            white-space: nowrap;
            transform: translateX(-50%);
        }

        /* Ghost marker that follows mouse in cut mode */
        #ghost-marker {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(251, 191, 36, 0.4);
            border-left: 1px dashed rgba(251, 191, 36, 0.7);
            pointer-events: none;
            display: none;
        }

        #ghost-label {
            position: absolute;
            top: 50%;
            left: 6px;
            transform: translateY(-50%);
            background: rgba(251, 191, 36, 0.85);
            color: #000;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 4px;
            white-space: nowrap;
        }

        /* Cut mode toggle button */
        .cut-mode-bar {
            display: none;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .cut-mode-bar.visible {
            display: flex;
        }

        .btn-cut-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: 10px;
            border: 1px solid rgba(251, 191, 36, 0.4);
            background: rgba(251, 191, 36, 0.08);
            color: #fbbf24;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .btn-cut-toggle:hover {
            background: rgba(251, 191, 36, 0.18);
            border-color: #fbbf24;
        }

        .btn-cut-toggle.active {
            background: rgba(251, 191, 36, 0.2);
            border-color: #fbbf24;
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.3);
        }

        .cut-mode-hint {
            font-size: 12px;
            color: var(--muted);
        }


        .player-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-play {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(167, 139, 250, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-play:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 28px rgba(167, 139, 250, 0.55);
        }

        .btn-play svg {
            width: 22px;
            height: 22px;
            fill: white;
        }

        .time-display {
            font-size: 13px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .time-display span {
            color: var(--text);
            font-weight: 500;
        }

        #progress-bar {
            flex: 1;
            height: 4px;
            background: var(--surface2);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }

        #progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            border-radius: 4px;
            width: 0%;
            transition: width 0.1s linear;
        }

        /* ── Segments ── */
        .segments-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .btn-add {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid rgba(167, 139, 250, 0.4);
            background: rgba(167, 139, 250, 0.1);
            color: var(--accent);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-add:hover {
            background: rgba(167, 139, 250, 0.2);
            border-color: var(--accent);
        }

        #segments-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .segment-row {
            display: grid;
            grid-template-columns: auto 1fr 1fr auto;
            gap: 12px;
            align-items: center;
            background: var(--surface2);
            border-radius: 14px;
            padding: 16px;
            border: 1px solid transparent;
            transition: border-color 0.2s;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .segment-row:hover {
            border-color: var(--border);
        }

        .segment-label {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .field-label {
            font-size: 11px;
            color: var(--muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .field-input {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 9px 12px;
            color: var(--text);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .field-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.15);
        }

        .speed-slider-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .speed-slider {
            flex: 1;
            -webkit-appearance: none;
            height: 4px;
            border-radius: 4px;
            background: var(--surface);
            outline: none;
            cursor: pointer;
        }

        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px rgba(167, 139, 250, 0.5);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .speed-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .speed-badge {
            min-width: 44px;
            text-align: right;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
        }

        .btn-remove {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid rgba(248, 113, 113, 0.3);
            background: rgba(248, 113, 113, 0.08);
            color: var(--danger);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .btn-remove:hover {
            background: rgba(248, 113, 113, 0.2);
            border-color: var(--danger);
        }

        .btn-remove svg {
            width: 14px;
            height: 14px;
        }

        /* ── Global Settings ── */
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 600px) {
            .settings-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ── Generate Button ── */
        .generate-section {
            text-align: center;
            margin-top: 28px;
        }

        .btn-generate {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 48px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #7c3aed, #2563eb, #db2777);
            background-size: 200% 200%;
            color: white;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(124, 58, 237, 0.4);
            transition: all 0.3s;
            animation: gradientShift 4s ease infinite;
        }

        @keyframes gradientShift {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(124, 58, 237, 0.55);
        }

        .btn-generate:active {
            transform: translateY(0);
        }

        .btn-generate svg {
            width: 20px;
            height: 20px;
        }

        /* ── Command Output ── */
        #command-output {
            display: none;
            margin-top: 20px;
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }

        .output-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.04);
            border-bottom: 1px solid var(--border);
        }

        .output-dots {
            display: flex;
            gap: 6px;
        }

        .output-dots span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .output-dots span:nth-child(1) {
            background: #ff5f57;
        }

        .output-dots span:nth-child(2) {
            background: #febc2e;
        }

        .output-dots span:nth-child(3) {
            background: #28c840;
        }

        .output-label {
            font-size: 12px;
            color: var(--muted);
            margin-left: 4px;
        }

        #output-text {
            padding: 16px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 13px;
            color: #e2e8f0;
            line-height: 1.7;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }

        /* ── Command Preview ── */
        #command-preview {
            margin-top: 16px;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .preview-label {
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        #command-text {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 12px;
            color: #a3e635;
            word-break: break-all;
            line-height: 1.6;
        }

        /* ── Timeline Visualizer ── */
        #timeline-viz {
            margin-top: 16px;
            height: 48px;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            position: relative;
        }

        .timeline-seg {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .timeline-seg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.1) 0%, transparent 100%);
        }

        /* ── Tooltip ── */
        .tooltip-wrap {
            position: relative;
            display: inline-block;
        }

        .tooltip-wrap:hover .tooltip {
            opacity: 1;
            pointer-events: auto;
        }

        .tooltip {
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
            color: var(--text);
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 10;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        /* ── Copy button ── */
        .btn-copy {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--muted);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            margin-left: auto;
        }

        .btn-copy:hover {
            color: var(--text);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* ── Export Button ── */
        .btn-export {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 48px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #059669, #0891b2);
            background-size: 200% 200%;
            color: white;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(5, 150, 105, 0.4);
            transition: all 0.3s;
            animation: gradientShift 4s ease infinite;
        }

        .btn-export:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(5, 150, 105, 0.55);
        }

        .btn-export:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-export svg {
            width: 20px;
            height: 20px;
        }

        .btn-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* ── Status Banner ── */
        #status-banner {
            display: none;
            margin-top: 16px;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            font-size: 14px;
            display: none;
            align-items: center;
            gap: 12px;
        }

        #status-banner.processing {
            border-color: rgba(167, 139, 250, 0.4);
            background: rgba(167, 139, 250, 0.07);
        }

        #status-banner.success {
            border-color: rgba(52, 211, 153, 0.4);
            background: rgba(52, 211, 153, 0.07);
            color: var(--success);
        }

        #status-banner.error {
            border-color: rgba(248, 113, 113, 0.4);
            background: rgba(248, 113, 113, 0.07);
            color: var(--danger);
        }

        .spinner {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid rgba(167, 139, 250, 0.3);
            border-top-color: var(--accent);
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- Header -->
        <header>
            <div class="logo-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 18V5l12-2v13M9 9l12-2" />
                </svg>
                声乐练习工具
            </div>
            <h1>Gamzatti</h1>
            <p class="subtitle">分段变速 · 平滑交叉淡入淡出 · 高质量音频处理</p>
        </header>

        <!-- File Upload -->
        <div class="card">
            <div class="card-title">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12" />
                </svg>
                音频文件
            </div>
            <div class="upload-zone" id="upload-zone" onclick="document.getElementById('audio-file-input').click()">
                <input type="file" id="audio-file-input" accept="audio/*" />
                <div class="upload-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">

                    </button>

                <div class="waveform-container" id="waveform-container">

        <!-- Timeline Visualizer -->
        <div class="card">

                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <rect x="3" y="3" width="18" height="18" rx="2" />
                    <path d="M3 9h18M9 21V9" />
                </svg>
                时间线预览
            </div>
            <div id="timeline-viz"></div>
        </div>

        <!-- Segments Config -->
        <div class="card">
            <div class="segments-header">
                <div class="card-title" style="margin-bottom:0; flex:1;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <path d="M12 20V10M6 20V4M18 20v-4" />
                    </svg>
                    分段配置
                </div>
                <button class="btn-add" onclick="addSegment()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <path d="M12 5v14M5 12h14" />
                    </svg>
                    添加切割点
                </button>
            </div>
            <div id="segments-container"></div>
        </div>

        <!-- Global Settings -->
        <div class="card">
            <div class="card-title">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="12" cy="12" r="3" />
                    <path
                        d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83" />
                </svg>
                全局设置
            </div>
            <div class="settings-grid">
                <div class="field-group">
                    <label class="field-label" for="global-slowdown">全局变速系数</label>
                    <div class="speed-slider-wrapper">
                        <input type="range" class="speed-slider" id="global-slowdown" min="0.5" max="1.2" step="0.01"
                            value="1.0" oninput="updateGlobalBadge(this)" />
                        <span class="speed-badge" id="global-badge">100%</span>
                    </div>
                    <div style="font-size:11px; color:var(--muted); margin-top:4px;">叠加作用于所有分段速度之上</div>
                </div>
                <div class="field-group">
                    <label class="field-label" for="crossfade-ms">交叉淡入淡出 (ms)</label>
                    <input type="number" class="field-input" id="crossfade-ms" value="100" min="0" max="1000"
                        step="10" />
                </div>
                <div class="field-group">
                    <label class="field-label" for="audio-filename">目标文件名 (Python 脚本中)</label>
                    <input type="text" class="field-input" id="audio-filename" value="gamsatti.mp3"
                        placeholder="例如: gamsatti.mp3" />

                    <label class="field-label">Python 脚本路径</label>
                    <input type="text" class="field-input" id="script-path" value="speed_changer.py"
                        placeholder="speed_changer.py" />

        <!-- Command Preview + Run + Export -->
        <div class="generate-section">
            <div id="command-preview">
                <div style="display:flex; align-items:center; margin-bottom:6px;">
                    <div class="preview-label">生成的 Python 调用语句</div>
                    <button class="btn-copy" onclick="copyCommand()">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" />
                            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" />
                        </svg>
                        复制
                    </button>
                </div>
                <div id="command-text">配置好分段后会自动显示...</div>
            </div>

            <!-- Server tip -->
            <div style="margin-top:12px; font-size:12px; color:var(--muted); text-align:center;">
                💡 需先在终端运行 <code
                    style="background:rgba(255,255,255,0.08);padding:2px 6px;border-radius:4px;color:var(--accent);">python3 server.py</code>
                以启动本地服务
            </div>

            <div class="btn-row" style="margin-top:20px;">
                <button class="btn-generate" onclick="generateCommand()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
                    </svg>
                    预览命令
                </button>

                <button class="btn-export" id="export-btn" onclick="runAndExport()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
                        <polyline points="7 10 12 15 17 10" />
                        <line x1="12" y1="15" x2="12" y2="3" />
                    </svg>
                    运行并导出 MP3
                </button>
            </div>

            <!-- Status Banner -->
            <div id="status-banner">
                <div class="spinner" id="status-spinner" style="display:none;"></div>
                <span id="status-text"></span>
            </div>
        </div>

        <!-- Output Terminal -->
        <div id="command-output">
            <div class="output-header">
                <div class="output-dots">
                    <span></span><span></span><span></span>
                </div>
                <div class="output-label">生成的 CLI 命令</div>
            </div>
            <pre id="output-text"></pre>
        </div>

    </div>

    <script>
        // ── State ──
        let segments = []; // Each: { endTime: number|null, speed: number }
        let audioBuffer = null;
        let audioCtx = null;
        let audioSource = null;
        let isPlaying = false;
        let startTimestamp = 0;
        let startOffset = 0;
        let animFrame = null;
        let totalDuration = 0;

        const SEG_COLORS = [
            'linear-gradient(135deg, #7c3aed, #6d28d9)',
            'linear-gradient(135deg, #2563eb, #1d4ed8)',
            'linear-gradient(135deg, #059669, #047857)',
            'linear-gradient(135deg, #d97706, #b45309)',
            'linear-gradient(135deg, #db2777, #be185d)',
            'linear-gradient(135deg, #0891b2, #0e7490)',
            'linear-gradient(135deg, #7c3aed, #db2777)',
        ];

        // ── Init ──
        window.addEventListener('DOMContentLoaded', () => {
            // Default: 3 cuts → 4 segments (as in original script)
            segments = [
                { endTime: 25, speed: 0.98 },
                { endTime: 45, speed: 0.96 },
                { endTime: 62, speed: 0.91 },
                { endTime: null, speed: 0.98 }, // last segment has no end
            ];
            renderSegments();
            updateTimeline();
            updateCommandPreview();

            // Drag & drop
            const zone = document.getElementById('upload-zone');
            zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
            zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
            zone.addEventListener('drop', e => {
                e.preventDefault(); zone.classList.remove('drag-over');
                const file = e.dataTransfer.files[0];
                if (file) handleFile(file);
            });
            document.getElementById('audio-file-input').addEventListener('change', e => {
                if (e.target.files[0]) handleFile(e.target.files[0]);
            });

            // Progress bar click
            document.getElementById('progress-bar').addEventListener('click', seekAudio);

            // Waveform interactions
            const wc = document.getElementById('waveform-canvas');
            wc.addEventListener('click', onWaveformClick);
            wc.addEventListener('mousemove', onWaveformMousemove);
            wc.addEventListener('mouseleave', onWaveformMouseleave);
        });

        // ── File Handling ──
        let cutMode = false;

        async function handleFile(file) {
            document.getElementById('file-name-text').textContent = file.name;
            document.getElementById('file-name-display').style.display = 'block';
            document.getElementById('audio-filename').value = file.name;

            const arrayBuffer = await file.arrayBuffer();
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            totalDuration = audioBuffer.duration;
            document.getElementById('duration-time').textContent = formatTime(totalDuration);
            document.getElementById('audio-player-section').style.display = 'block';
            document.getElementById('cut-mode-bar').classList.add('visible');

            drawWaveform();
            drawCutMarkers();
            updateCommandPreview();
        }

        // ── Waveform ──
        function drawWaveform() {
            const canvas = document.getElementById('waveform-canvas');
            const dpr = window.devicePixelRatio || 1;
            canvas.width = canvas.offsetWidth * dpr;
            canvas.height = canvas.offsetHeight * dpr;
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            const W = canvas.offsetWidth, H = canvas.offsetHeight;

            const data = audioBuffer.getChannelData(0);
            const step = Math.ceil(data.length / W);
            const mid = H / 2;

            ctx.clearRect(0, 0, W, H);
            const grad = ctx.createLinearGradient(0, 0, W, 0);
            grad.addColorStop(0, '#7c3aed');
            grad.addColorStop(0.5, '#2563eb');
            grad.addColorStop(1, '#db2777');
            ctx.fillStyle = grad;

            for (let x = 0; x < W; x++) {
                let min = 1, max = -1;
                for (let j = 0; j < step; j++) {
                    const d = data[x * step + j] || 0;
                    if (d < min) min = d;
                    if (d > max) max = d;
                }
                const barH = Math.max(1, (max - min) * mid * 0.9);
                ctx.fillRect(x, mid - barH, 1, barH * 2);
            }
        }

        // ── Playback ──
        document.getElementById('play-btn').addEventListener('click', togglePlay);
        function togglePlay() {
            if (!audioBuffer) return;
            if (isPlaying) pauseAudio(); else playAudio(startOffset);
        }
        function playAudio(offset = 0) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (audioSource) { audioSource.disconnect(); audioSource = null; }
            audioSource = audioCtx.createBufferSource();
            audioSource.buffer = audioBuffer;
            audioSource.connect(audioCtx.destination);
            audioSource.start(0, offset);
            audioSource.onended = () => { if (isPlaying) { isPlaying = false; startOffset = 0; updatePlayUI(); } };
            startTimestamp = audioCtx.currentTime - offset;
            startOffset = offset;
            isPlaying = true;
            updatePlayUI();
            animateProgress();
        }
        function pauseAudio() {
            if (audioSource) { audioSource.stop(); audioSource = null; }
            startOffset = audioCtx.currentTime - startTimestamp;
            isPlaying = false;
            cancelAnimationFrame(animFrame);
            updatePlayUI();
        }
        function updatePlayUI() {
            const icon = document.getElementById('play-icon');
            icon.innerHTML = isPlaying
                ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'
                : '<path d="M8 5v14l11-7z"/>';
        }
        function animateProgress() {
            const current = audioCtx.currentTime - startTimestamp;
            const pct = Math.min(100, (current / totalDuration) * 100);
            document.getElementById('progress-fill').style.width = pct + '%';
            document.getElementById('current-time').textContent = formatTime(current);
            document.getElementById('playhead').style.left = pct + '%';
            if (isPlaying) animFrame = requestAnimationFrame(animateProgress);
        }
        function seekAudio(e) {
            if (!audioBuffer) return;
            const bar = document.getElementById('progress-bar');
            const pct = e.offsetX / bar.offsetWidth;
            const offset = pct * totalDuration;
            startOffset = offset;
            if (isPlaying) playAudio(offset);
            else {
                document.getElementById('progress-fill').style.width = (pct * 100) + '%';
                document.getElementById('current-time').textContent = formatTime(offset);
                document.getElementById('playhead').style.left = (pct * 100) + '%';
            }
        }

        // ── Cut mode ──
        function toggleCutMode() {
            cutMode = !cutMode;
            const btn = document.getElementById('btn-cut-toggle');
            const container = document.getElementById('waveform-container');
            const hint = document.getElementById('cut-mode-hint');
            btn.classList.toggle('active', cutMode);
            container.classList.toggle('cut-mode', cutMode);
            hint.textContent = cutMode
                ? '✂ 点击波形上任意位置添加切割点 · 再次点击按钮退出切割模式'
                : '开启后点击波形可添加切割点';
            if (!cutMode) document.getElementById('ghost-marker').style.display = 'none';
        }

        function onWaveformClick(e) {
            if (!audioBuffer) return;
            const canvas = document.getElementById('waveform-canvas');
            const pct = e.offsetX / canvas.offsetWidth;
            const timeSec = parseFloat((pct * totalDuration).toFixed(1));

            if (cutMode) {
                // Add a cut at this time
                addCutAt(timeSec);
            } else {
                // Seek
                const offset = pct * totalDuration;
                startOffset = offset;
                if (isPlaying) playAudio(offset);
            }
        }

        function addCutAt(timeSec) {
            // Don't duplicate an existing cut
            const existing = segments.slice(0, -1).map(s => s.endTime);
            if (existing.some(t => Math.abs(t - timeSec) < 0.5)) return;

            // Find insertion index (keep sorted by endTime)
            let insertIdx = segments.length - 1;
            for (let i = 0; i < segments.length - 1; i++) {
                if (timeSec < segments[i].endTime) { insertIdx = i; break; }
            }
            // Inherit speed from the segment being split
            const inheritSpeed = segments[insertIdx]?.speed ?? 0.97;
            segments.splice(insertIdx, 0, { endTime: timeSec, speed: inheritSpeed });
            renderSegments();
            updateTimeline();
            updateCommandPreview();
            drawCutMarkers();
        }

        function onWaveformMousemove(e) {
            if (!cutMode || !audioBuffer) return;
            const canvas = document.getElementById('waveform-canvas');
            const pct = e.offsetX / canvas.offsetWidth;
            const timeSec = (pct * totalDuration).toFixed(1);
            const ghost = document.getElementById('ghost-marker');
            ghost.style.display = 'block';
            ghost.style.left = (pct * 100) + '%';
            document.getElementById('ghost-label').textContent = timeSec + 's';
        }

        function onWaveformMouseleave() {
            document.getElementById('ghost-marker').style.display = 'none';
        }

        function drawCutMarkers() {
            if (!audioBuffer) return;
            const layer = document.getElementById('cut-markers-layer');
            layer.innerHTML = '';
            const container = document.getElementById('waveform-container');
            const W = container.offsetWidth;

            segments.slice(0, -1).forEach((seg, i) => {
                const pct = (seg.endTime / totalDuration) * 100;
                const color = SEG_COLORS[i % SEG_COLORS.length]
                    .replace('linear-gradient(135deg, ', '').split(',')[0].trim();
                const marker = document.createElement('div');
                marker.className = 'cut-marker';
                marker.style.left = pct + '%';
                marker.innerHTML = `
                    <div class="cut-marker-line" style="background:${color};box-shadow:0 0 6px ${color}88;"></div>
                    <div class="cut-marker-label" style="background:${color};color:#fff;">${seg.endTime}s</div>
                `;
                layer.appendChild(marker);
            });
        }

        function seekFromWaveform(e) {
            if (!audioBuffer) return;
            const canvas = document.getElementById('waveform-canvas');
            const pct = e.offsetX / canvas.offsetWidth;
            const offset = pct * totalDuration;
            startOffset = offset;
            if (isPlaying) playAudio(offset);
        }

        function formatTime(s) {
            s = Math.max(0, s);
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${sec.toString().padStart(2, '0')}`;
        }

        // ── Segments ──
        function renderSegments() {
            const container = document.getElementById('segments-container');
            container.innerHTML = '';

            segments.forEach((seg, i) => {
                const isLast = i === segments.length - 1;
                const color = SEG_COLORS[i % SEG_COLORS.length];
                const label = ['A', 'B', 'C', 'D', 'E', 'F', 'G'][i % 7];
                const startSec = i === 0 ? 0 : (segments[i - 1].endTime || 0);
                const endLabel = isLast ? '结尾' : (seg.endTime != null ? seg.endTime + 's' : '—');

                const row = document.createElement('div');
                row.className = 'segment-row';
                row.innerHTML = `
      <div class="segment-label" style="background:${color.replace('linear-gradient(135deg, ', '').split(',')[0].trim()};color:#fff;">${label}</div>

      <div class="field-group">
        <div class="field-label">切割时间点 (结束秒)</div>
        ${isLast
                        ? `<input class="field-input" disabled value="结尾" style="color:var(--muted);" />`
                        : `<input type="number" class="field-input" value="${seg.endTime ?? ''}" min="0" step="0.1"
               placeholder="秒" oninput="updateSegmentTime(${i}, this.value)" />`
                    }
      </div>

      <div class="field-group">
        <div class="field-label">速度 &nbsp;<span style="color:var(--accent);font-weight:600;" id="spd-badge-${i}">${Math.round(seg.speed * 100)}%</span></div>
        <div class="speed-slider-wrapper">
          <input type="range" class="speed-slider" min="0.5" max="1.3" step="0.01" value="${seg.speed}"
            oninput="updateSegmentSpeed(${i}, this.value)" />
        </div>
      </div>

      ${segments.length > 2
                        ? `<button class="btn-remove" onclick="removeSegment(${i})" title="删除此段">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
           </button>`
                        : `<div style="width:32px;"></div>`
                    }
    `;
                container.appendChild(row);
            });
        }

        function addSegment() {
            // Insert a new cut before the last (final) segment
            const lastCutTime = segments.length >= 2 ? (segments[segments.length - 2].endTime || 0) + 20 : 30;
            const insertIdx = segments.length - 1;
            segments.splice(insertIdx, 0, { endTime: lastCutTime, speed: 0.95 });
            renderSegments();
            updateTimeline();
            updateCommandPreview();
        }

        function removeSegment(i) {
            if (segments.length <= 2) return; // minimum 1 segment = 2 rows (last always exists)
            // Don't remove the last row
            if (i === segments.length - 1) return;
            segments.splice(i, 1);
            renderSegments();
            updateTimeline();
            updateCommandPreview();
        }

        function updateSegmentTime(i, val) {
            segments[i].endTime = parseFloat(val) || 0;
            updateTimeline();
            updateCommandPreview();
            drawCutMarkers();
        }

        function updateSegmentSpeed(i, val) {
            segments[i].speed = parseFloat(val);
            const badge = document.getElementById(`spd-badge-${i}`);
            if (badge) badge.textContent = Math.round(parseFloat(val) * 100) + '%';
            updateCommandPreview();
        }

        function updateGlobalBadge(el) {
            document.getElementById('global-badge').textContent = Math.round(el.value * 100) + '%';
            updateCommandPreview();
        }

        // ── Timeline Visualizer ──
        function updateTimeline() {
            const viz = document.getElementById('timeline-viz');
            viz.innerHTML = '';

            const endTimes = segments.slice(0, -1).map(s => s.endTime || 0);
            const totalTime = totalDuration > 0 ? totalDuration : (endTimes.length > 0 ? endTimes[endTimes.length - 1] * 1.3 : 100);

            let prevTime = 0;
            segments.forEach((seg, i) => {
                const endTime = i === segments.length - 1 ? totalTime : (seg.endTime || 0);
                const width = Math.max(0, endTime - prevTime) / totalTime * 100;
                const color = SEG_COLORS[i % SEG_COLORS.length];
                const label = ['A', 'B', 'C', 'D', 'E', 'F', 'G'][i % 7];

                const div = document.createElement('div');
                div.className = 'timeline-seg';
                div.style.cssText = `width:${width}%;background:${color};`;
                div.innerHTML = `<span>${label} ${Math.round(seg.speed * 100)}%</span>`;
                viz.appendChild(div);
                prevTime = endTime;
            });
        }

        // ── Command Preview ──
        function updateCommandPreview() {
            const timestamps = segments.slice(0, -1).map(s => s.endTime ?? 0);
            const speeds = segments.map(s => s.speed);
            const global = parseFloat(document.getElementById('global-slowdown')?.value || '1.0');
            const filename = document.getElementById('audio-filename')?.value || 'gamsatti.mp3';

            const tsStr = '[' + timestamps.join(', ') + ']';
            const spStr = '[' + speeds.join(', ') + ']';

            const code = `process_audio("${filename}", ${tsStr}, ${spStr}, overall_factor=${global.toFixed(2)})`;
            document.getElementById('command-text').textContent = code;
        }

        // ── Run & Export ──
        async function runAndExport() {
            const timestamps = segments.slice(0, -1).map(s => s.endTime ?? 0);
            const speeds = segments.map(s => s.speed);
            const overall = parseFloat(document.getElementById('global-slowdown').value);
            const filename = document.getElementById('audio-filename').value || 'gamsatti.mp3';

            const btn = document.getElementById('export-btn');
            const banner = document.getElementById('status-banner');
            const statusText = document.getElementById('status-text');
            const spinner = document.getElementById('status-spinner');

            btn.disabled = true;
            banner.style.display = 'flex';
            banner.className = 'processing';
            spinner.style.display = 'block';
            statusText.textContent = '⏳ 正在处理音频，请稍候（可能需要数十秒）...';

            try {
                let body, headers = {};
                const uploadedFile = document.getElementById('audio-file-input').files[0];

                if (uploadedFile) {
                    const fd = new FormData();
                    fd.append('audio', uploadedFile);
                    fd.append('params', JSON.stringify({ timestamps, speeds, overall_factor: overall, filename: uploadedFile.name }));
                    body = fd;
                } else {
                    headers['Content-Type'] = 'application/json';
                    body = JSON.stringify({ timestamps, speeds, overall_factor: overall, filename });
                }

                const resp = await fetch('http://localhost:5001/process', { method: 'POST', headers, body });

                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({ error: '未知错误' }));
                    throw new Error(err.error || `HTTP ${resp.status}`);
                }

                // Trigger download
                const blob = await resp.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const cd = resp.headers.get('Content-Disposition') || '';
                const nameMatch = cd.match(/filename="?([^"]+)"?/);
                a.download = nameMatch ? nameMatch[1] : 'output.mp3';
                a.href = url;
                a.click();
                URL.revokeObjectURL(url);

                banner.className = 'success';
                spinner.style.display = 'none';
                statusText.textContent = `✅ 处理完成！MP3 已开始下载 → ${a.download}`;
            } catch (e) {
                banner.className = 'error';
                spinner.style.display = 'none';
                if (e.message.includes('fetch') || e.message.includes('Failed')) {
                    statusText.textContent = '❌ 无法连接到本地服务，请先在终端运行 python3 server.py';
                } else {
                    statusText.textContent = `❌ 错误：${e.message}`;
                }
            } finally {
                btn.disabled = false;
            }
        }

        function copyCommand() {
            const text = document.getElementById('command-text').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('.btn-copy');
                btn.textContent = '✓ 已复制';
                setTimeout(() => { btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> 复制'; }, 2000);
            });
        }

        // ── Generate Command ──
        function generateCommand() {
            const timestamps = segments.slice(0, -1).map(s => s.endTime ?? 0);
            const speeds = segments.map(s => s.speed);
            const global = parseFloat(document.getElementById('global-slowdown').value);
            const filename = document.getElementById('audio-filename').value || 'gamsatti.mp3';
            const scriptPath = document.getElementById('script-path').value || 'speed_changer.py';

            const tsStr = '[' + timestamps.join(', ') + ']';
            const spStr = '[' + speeds.join(', ') + ']';

            const inlineCode = `
import sys; sys.path.insert(0, '.')
from speed_changer import process_audio
process_audio("${filename}", ${tsStr}, ${spStr}, overall_factor=${global.toFixed(2)})
`.trim();

            const shellCmd = `python3 -c "${inlineCode.replace(/"/g, '\\"').replace(/\n/g, '; ')}"`;

            const output = document.getElementById('command-output');
            output.style.display = 'block';
            document.getElementById('output-text').textContent =
                `# 在终端中运行以下命令：
# (确保已安装 librosa、soundfile、ffmpeg)

python3 << 'EOF'
from speed_changer import process_audio

cut_timestamps = ${tsStr}
segment_speeds = ${spStr}
global_slowdown = ${global.toFixed(2)}

process_audio("${filename}", cut_timestamps, segment_speeds, global_slowdown)
EOF

# 或者直接修改 speed_changer.py 中的核心控制区：
#   cut_timestamps = ${tsStr}
#   segment_speeds = ${spStr}
#   global_slowdown = ${global.toFixed(2)}
# 然后运行: python3 ${scriptPath}`;

            output.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>

</html>
