<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TempoTailor: Music Speed Changer</title>
    <meta name="description"
        content="TempoTailor lets you adjust the playback speed of audio segments independently and export the result as an MP3." />
    <link rel="stylesheet" href="/static/styles.css" />
</head>

<body>
    <div class="container">

        <!-- Header -->
        <header>
            <pre>
╔══════════════════════════════════╗
║     T E M P O T A I L O R       ║
║     Music Speed Changer         ║
╚══════════════════════════════════╝
            </pre>
            <div class="prompt cursor">Ready</div>
        </header>

        <!-- Upload / Player -->
        <div class="divider"></div>
        <div class="section">
            <div class="section-title">Audio <span class="player-label" id="player-filename"></span></div>
            <div class="upload-zone" id="upload-zone">
                <input type="file" id="audio-file-input" accept="audio/*" />
                <span class="dollar">$</span> <span class="hint">Drop audio file here or click to select</span>
            </div>
            <div id="player-section">
                <div class="player-row">
                    <div class="waveform-wrap" id="waveform-wrap">
                        <span class="waveform-time" id="player-total">0:00</span>
                        <span class="playhead-time" id="player-current">0:00</span>
                        <div id="waveform-inner">
                            <div class="playhead-line" id="playhead"></div>
                            <canvas id="waveform-canvas"></canvas>
                        </div>
                    </div>
                    <div class="player-bar-row">
                        <button class="player-btn" id="play-btn">></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Segments -->
        <div class="divider"></div>
        <div class="section">
            <div class="section-title">Sections</div>
            <div id="segments-container"></div>
            <div class="seg-actions">
                <button class="btn" id="btn-add-segment">Split</button>
                <span id="seg-notification" class="seg-notification"></span>
            </div>
        </div>

        <!-- Output -->
        <div class="divider"></div>
        <div class="section">
            <div class="section-title">Output</div>

            <div class="output-row">
                <span class="output-label">Estimated duration:</span>
                <span id="predicted-duration-text">--:--</span>
            </div>

            <button class="btn btn-export" id="export-btn">[ Run &amp; Export MP3 ]</button>

            <div id="status-banner"><span id="status-text"></span></div>
        </div>

    </div>

    <script src="/static/app.js"></script>
</body>

</html>
